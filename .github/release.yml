# Configuration for GitHub's auto-generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Labels are namespaced (kind/*, area/*) so this dedicated release-notes set
# does not collide with the existing project-filter labels (bug, documentation).
# Run .github/labels.sh to create/update these labels in the repo.
#
# Each PR is placed in the FIRST category whose labels it matches, so order
# matters: what users need when upgrading comes first (Breaking Changes,
# Deprecations), then user-facing changes, and internal changes last.
changelog:
  exclude:
    labels:
      - skip-changelog
      # dev-only is applied by the path labeler (.github/labeler.yml) only when
      # every changed file is development-only (uv.lock, .github/**, ...).
      # Exclusion is evaluated before the categories below, so it wins over all
      # of them — including Security for a lock-only Dependabot bump.
      - dev-only
      # dev-dependencies is set by Renovate (renovate.json) on bumps of
      # [dependency-groups] entries. It is deliberately NOT a labeler.yml label:
      # pyproject.toml is not dev-only, so no path rule can derive it.
      - dev-dependencies
  categories:
    # Breaking Changes is deliberately first. A breaking change is often also a
    # feature or a bug fix, and since a PR lands in only the FIRST matching
    # category it is listed here instead of there — that is the section readers
    # of a major release need to see, and it keeps it from being buried.
    #
    # There is no way to make a category depend on the version being released:
    # .github/release.yml is static config. The section is self-gating instead —
    # it only appears when a PR in the release range carries kind/breaking.
    - title: ⚠️ Breaking Changes
      labels:
        - kind/breaking
    # Deprecations come right after Breaking Changes: they tell users what will
    # break in a future release, so they shouldn't be buried under Features or
    # Bug Fixes. A PR that deprecates something while adding its replacement is
    # listed here rather than under Features.
    - title: 🗑️ Deprecations
      labels:
        - kind/deprecation
    - title: 🚀 Features
      labels:
        - kind/feature
    - title: 🔍 Search / LLM
      labels:
        - area/search
        - area/llm
    - title: 🐛 Bug Fixes
      labels:
        - kind/bug
    - title: 🔒 Security Updates
      labels:
        - kind/security
    # Dependency Updates sits above CI / Build on purpose: a dependency PR can
    # also get a path-based label. Since a PR lands in the FIRST matching
    # category, listing dependencies first keeps those bumps in the right section.
    - title: 📦 Dependency Updates
      labels:
        - kind/dependencies
    - title: 📚 Documentation
      labels:
        - kind/documentation
    # Internal changes come last: they rarely affect users of the library.
    - title: ♻️ Refactors & Internal Changes
      labels:
        - kind/refactor
        - kind/chore
    - title: 🧪 Tests
      labels:
        - kind/test
    - title: 🔧 CI / Build / Tooling
      labels:
        - kind/ci
        - kind/build
    - title: 🔀 Other Changes
      labels:
        - "*"
