# Configuration for GitHub's auto-generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-a-repository/automatically-generated-release-notes
#
# Each PR is placed in the FIRST category whose labels it matches, so order
# matters: more specific buckets (Search / LLM, Security) come before the
# broader ones (Bug Fixes, Dependency Updates).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🔍 Search / LLM
      labels:
        - search
        - llm
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: ♻️ Refactors & Internal Changes
      labels:
        - refactor
        - chore
        - internal
    - title: 🧪 Tests
      labels:
        - test
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔒 Security Updates
      labels:
        - security
    - title: 🔧 CI / Build / Tooling
      labels:
        - ci
        - build
    - title: 📦 Dependency Updates
      labels:
        - dependencies
    - title: 🔀 Other Changes
      labels:
        - "*"
