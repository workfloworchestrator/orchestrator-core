# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Linting tests

on:
  workflow_call:

env:
  UV_LOCKED: true # Assert that the `uv.lock` will remain unchanged

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # It is considered best practice to pin to a specific uv version.
          version: "0.13.3"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        # --all-extras: [project.optional-dependencies]
        # --dev: group 'dev' from [dependency-groups]
        run: uv sync --all-extras --dev

      - name: Check with mypy
        run: uv run mypy .

  # The hooks do not depend on the python version, so they run once instead of per matrix entry
  hooks:
    name: prek hooks
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # It is considered best practice to pin to a specific uv version.
          version: "0.13.3"
          python-version: "3.13"

      - name: Install the project
        # The local vulture hook runs through `uv run`, so the project must be installed
        run: uv sync --all-extras --dev

      - name: Cache prek hooks and environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check edited files contain an up-to-date copyright header
        run: uv run prek run copyright-required

      - name: Run remaining prek hooks
        run: uv run prek run --all-files
        env:
          SKIP: mypy,copyright-required
