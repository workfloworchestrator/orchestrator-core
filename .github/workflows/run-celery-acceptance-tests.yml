# Celery acceptance tests. Reusable only — invoked from
# ``run-tests.yml`` after the unit-test gate passes, so the unit
# matrix runs at most once per PR.

name: Pytest Celery Acceptance Tests

on:
  workflow_call:
  workflow_dispatch:

env:
  UV_LOCKED: true # Assert that the `uv.lock` will remain unchanged

jobs:
  container_job:
    name: Pytest Celery Acceptance Tests Python (${{ matrix.python-version }}) Postgres (${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
        postgres-version: ["17"]
      fail-fast: false
    container: ubuntu:latest
    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres-version }}
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: nwa
          POSTGRES_USER: nwa
          POSTGRES_DB: orchestrator-core-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # It is considered best practice to pin to a specific uv version.
          version: "0.12.4"
          python-version: ${{ matrix.python-version }}

      - name: Install project and dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run pytest-celery tests
        env:
          POSTGRES_DB: orchestrator-core-test
          POSTGRES_USER: nwa
          POSTGRES_PASSWORD: nwa
          POSTGRES_HOST: postgres
          ENVIRONMENT: TESTING
          PYTHONPATH: .
          # Add Celery-specific environment variables
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: |
          CACHE_URI=redis://redis:6379 \
          DATABASE_URI=postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST/$POSTGRES_DB \
          CELERY_BROKER_URL=$CELERY_BROKER_URL \
          CELERY_RESULT_BACKEND=$CELERY_RESULT_BACKEND \
          uv run pytest test/acceptance_tests/celery -v \
            --cov-branch --cov=orchestrator --cov-report=xml

      - name: Install codecov dependencies
        run: apt-get update && apt-get install -y git curl gpg

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: celery
