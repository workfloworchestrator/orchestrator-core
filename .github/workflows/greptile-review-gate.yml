name: Greptile review gate

# Greptile reviews a PR only when the `greptile/run` label is added to it (see
# the `labels` filter in .greptile/config.json). This workflow is the one place
# that adds that label, so it can limit what each PR spends from our monthly
# budget of free open-source Greptile credits:
#
# - When a PR is ready for review and its author has write access to the repo,
#   `greptile/run` is added once. That initial review also runs TREX
#   (configured in the Greptile dashboard), so it costs FIRST_REVIEW_CREDITS.
# - Anyone who can label PRs requests another review by adding `greptile-review`.
#   The workflow removes it and re-adds `greptile/run` while the PR stays within
#   MAX_CREDITS. Repo admins (core-maintainers) are not capped, so they can force
#   another review when it is really needed.
# - PRs from authors without write access are not reviewed automatically; a
#   maintainer adds `greptile-review` to request a review.
#
# Credits are counted from the PR's history of `greptile/run` labeled events, so
# they are an estimate and do not include reviews requested by commenting
# `@greptileai`.
#
# Uses pull_request_target so PRs from forks get a token that can edit labels.
# It never checks out or runs code from the PR.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - labeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: greptile-review-gate-${{ github.event.pull_request.number }}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  REQUEST_LABEL: greptile-review
  TRIGGER_LABEL: greptile/run
  FIRST_REVIEW_CREDITS: 3 # Base review (1) + TREX (2)
  REREVIEW_CREDITS: 1
  MAX_CREDITS: 5

jobs:
  initial-review:
    if: >-
      github.event.action != 'labeled'
      && !github.event.pull_request.draft
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-slim
    steps:
      - name: "🦖 Request the initial Greptile review"
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          permission=$(gh api "repos/${REPO}/collaborators/${AUTHOR}/permission" --jq .permission)
          if [[ "${permission}" != "admin" && "${permission}" != "write" ]]; then
            echo "${AUTHOR} has '${permission}' access; a maintainer can add '${REQUEST_LABEL}' to request a review."
            exit 0
          fi
          reviews=$(gh api --paginate "repos/${REPO}/issues/${PR}/events" \
            --jq ".[] | select(.event == \"labeled\" and .label.name == \"${TRIGGER_LABEL}\") | .id" | wc -l)
          if (( reviews > 0 )); then
            echo "This PR was already reviewed by Greptile; add '${REQUEST_LABEL}' to request another review."
            exit 0
          fi
          gh pr edit "${PR}" --repo "${REPO}" --add-label "${TRIGGER_LABEL}"

  rerun:
    # Labels added by this workflow's GITHUB_TOKEN do not trigger workflows, so a
    # `labeled` event for TRIGGER_LABEL always comes from a person.
    if: >-
      github.event.action == 'labeled'
      && contains(fromJSON('["greptile-review", "greptile/run"]'), github.event.label.name)
    runs-on: ubuntu-slim
    steps:
      - name: "🦖 Request another Greptile review within the credit cap"
        env:
          SENDER: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
        run: |
          permission=$(gh api "repos/${REPO}/collaborators/${SENDER}/permission" --jq .permission)

          if [[ "${LABEL}" == "${TRIGGER_LABEL}" ]]; then
            # Added by hand: Greptile has already been triggered, so this can only
            # steer people towards REQUEST_LABEL. Admins may set it directly.
            if [[ "${permission}" != "admin" ]]; then
              gh pr edit "${PR}" --repo "${REPO}" --remove-label "${TRIGGER_LABEL}"
              gh pr comment "${PR}" --repo "${REPO}" --body \
                "@${SENDER} \`${TRIGGER_LABEL}\` is set by automation only; add \`${REQUEST_LABEL}\` to request a Greptile review. That keeps each PR within its share of our free Greptile credits."
            fi
            exit 0
          fi

          gh pr edit "${PR}" --repo "${REPO}" --remove-label "${REQUEST_LABEL}"

          reviews=$(gh api --paginate "repos/${REPO}/issues/${PR}/events" \
            --jq ".[] | select(.event == \"labeled\" and .label.name == \"${TRIGGER_LABEL}\") | .id" | wc -l)
          if (( reviews == 0 )); then
            used=0
            next=${FIRST_REVIEW_CREDITS}
          else
            used=$(( FIRST_REVIEW_CREDITS + (reviews - 1) * REREVIEW_CREDITS ))
            next=${REREVIEW_CREDITS}
          fi
          echo "Reviews so far: ${reviews}, estimated credits used: ${used}, next review: ${next}"

          if (( used + next > MAX_CREDITS )) && [[ "${permission}" != "admin" ]]; then
            gh pr comment "${PR}" --repo "${REPO}" --body \
              "This PR has used its Greptile review budget (about ${used} of ${MAX_CREDITS} credits from our free monthly open-source allowance), so no further review was requested. If another review is really needed, a core maintainer (\`@workfloworchestrator/core-maintainers\`) can add the \`${REQUEST_LABEL}\` label to force one."
            exit 0
          fi

          # Greptile reviews when the label is added, so remove it first if present.
          gh pr edit "${PR}" --repo "${REPO}" --remove-label "${TRIGGER_LABEL}" || true
          gh pr edit "${PR}" --repo "${REPO}" --add-label "${TRIGGER_LABEL}"
