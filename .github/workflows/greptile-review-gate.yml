name: Greptile review gate

# Greptile reviews a PR only when the `greptile/run` label is added to it (see
# the `labels` filter in .greptile/config.json). This workflow is the one place
# that adds that label, so it can limit what each PR spends from our monthly
# budget of free open-source Greptile credits:
#
# - When a PR is ready for review and its author has write access to the repo,
#   `greptile/run` is added once.
# - Anyone who can label PRs requests another review by adding `greptile-review`.
#   The workflow removes it and re-adds `greptile/run` while the PR stays within
#   MAX_REVIEWS. Repo admins (core-maintainers) are not capped, so they can force
#   another review when it is really needed.
# - PRs from authors without write access are not reviewed automatically; a
#   maintainer adds `greptile-review` to request a review.
# - TREX (in-depth reviews that cost extra credits) runs only while the PR has
#   the `greptile-review-trex` label; the TREX rule in the Greptile dashboard
#   matches on it. Only repo admins may set it: the workflow removes it when
#   anyone else adds it. When an admin adds it, a review is triggered right away.
#
# Reviews are counted from the PR's history of `greptile/run` labeled events, so
# reviews requested by commenting `@greptileai` are not included.
#
# Uses pull_request_target so PRs from forks get a token that can edit labels.
# It never checks out or runs code from the PR.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - labeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: greptile-review-gate-${{ github.event.pull_request.number }}

jobs:
  gate:
    # Labels added by this workflow's GITHUB_TOKEN do not trigger workflows, so a
    # `labeled` event always comes from a person.
    if: >-
      (github.event.action == 'labeled'
        && contains(fromJSON('["greptile-review", "greptile-review-trex", "greptile/run"]'), github.event.label.name))
      || (github.event.action != 'labeled'
        && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-slim
    steps:
      - name: "🦖 Request a Greptile review within the per-PR budget"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          REQUEST_LABEL: greptile-review
          TREX_LABEL: greptile-review-trex
          TRIGGER_LABEL: greptile/run
          MAX_REVIEWS: 5
        run: |
          permission_of() {
            gh api "repos/${REPO}/collaborators/$1/permission" --jq .permission
          }

          labeled_events() {
            gh api --paginate "repos/${REPO}/issues/${PR}/events" \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$1\") | .actor.login"
          }

          comment() {
            gh pr comment "${PR}" --repo "${REPO}" --body "$1"
          }

          # Drop the TREX label unless an admin set it last, e.g. when a PR was opened with it.
          drop_unauthorized_trex() {
            if gh pr view "${PR}" --repo "${REPO}" --json labels --jq '.labels[].name' | grep -qxF "${TREX_LABEL}"; then
              actor=$(labeled_events "${TREX_LABEL}" | tail -n 1)
              if [[ -z "${actor}" || "$(permission_of "${actor}")" != "admin" ]]; then
                gh pr edit "${PR}" --repo "${REPO}" --remove-label "${TREX_LABEL}"
              fi
            fi
          }

          # Greptile reviews when the label is added, so remove it first if present.
          trigger_review() {
            drop_unauthorized_trex
            gh pr edit "${PR}" --repo "${REPO}" --remove-label "${TRIGGER_LABEL}" || true
            gh pr edit "${PR}" --repo "${REPO}" --add-label "${TRIGGER_LABEL}"
          }

          reviews=$(labeled_events "${TRIGGER_LABEL}" | wc -l)
          echo "Greptile reviews so far: ${reviews}"

          if [[ "${ACTION}" != "labeled" ]]; then
            permission=$(permission_of "${AUTHOR}")
            if [[ "${permission}" != "admin" && "${permission}" != "write" ]]; then
              echo "${AUTHOR} has '${permission}' access; a maintainer can add '${REQUEST_LABEL}' to request a review."
            elif (( reviews > 0 )); then
              echo "This PR was already reviewed by Greptile; add '${REQUEST_LABEL}' to request another review."
            else
              trigger_review
            fi
            exit 0
          fi

          permission=$(permission_of "${SENDER}")

          case "${LABEL}" in
            "${TRIGGER_LABEL}")
              # Added by hand: Greptile has already been triggered, so this can only
              # steer people towards REQUEST_LABEL. Admins may set it directly.
              if [[ "${permission}" != "admin" ]]; then
                gh pr edit "${PR}" --repo "${REPO}" --remove-label "${TRIGGER_LABEL}"
                comment "@${SENDER} \`${TRIGGER_LABEL}\` is set by automation only; add \`${REQUEST_LABEL}\` to request a Greptile review. That keeps each PR within its share of our free Greptile credits."
              fi
              ;;
            "${TREX_LABEL}")
              if [[ "${permission}" != "admin" ]]; then
                gh pr edit "${PR}" --repo "${REPO}" --remove-label "${TREX_LABEL}"
                comment "@${SENDER} TREX reviews use extra Greptile credits, so only a core maintainer (\`@workfloworchestrator/core-maintainers\`) can add \`${TREX_LABEL}\`."
              else
                trigger_review
              fi
              ;;
            "${REQUEST_LABEL}")
              gh pr edit "${PR}" --repo "${REPO}" --remove-label "${REQUEST_LABEL}"
              if (( reviews >= MAX_REVIEWS )) && [[ "${permission}" != "admin" ]]; then
                comment "This PR has used its Greptile review budget from our free monthly open-source allowance, so no further review was requested. If another review is really needed, a core maintainer (\`@workfloworchestrator/core-maintainers\`) can add the \`${REQUEST_LABEL}\` label to force one."
              else
                trigger_review
              fi
              ;;
          esac
