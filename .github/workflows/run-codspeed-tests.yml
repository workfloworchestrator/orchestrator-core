name: CodSpeed

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_LOCKED: true # Assert that the `uv.lock` will remain unchanged

jobs:
  codspeed:
    name: Run benchmarks (simulation)
    runs-on: ubuntu-26.04
    container:
      image: python:3.13-bookworm
      options: --privileged
    services:
      postgres:
        image: pgvector/pgvector:pg15
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: nwa
          POSTGRES_USER: nwa
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # It is considered best practice to pin to a specific uv version.
          version: "0.12.23"

      - name: Install the project
        # --all-extras: [project.optional-dependencies]
        # --dev: group 'dev' from [dependency-groups]
        run: uv sync --all-extras --dev

      - name: Cache APT packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/
          key: ${{ runner.os }}-apt-pkgs-${{ hashFiles('**/apt-packages-run-codspeed-tests.txt') }}

      - name: Install OS dependencies
        run: |
          apt-get update
          apt-get install $(grep -vE '^\s*#' .github/workflows/files/apt-packages-run-codspeed-tests.txt | awk NF | tr '\n' ' ') -y

      # Prevent error "repository path is not owned by the current user"
      - name: Fix git owner
        run: git config --global --add safe.directory "*"

      # Speculatively add the cargo binary directory to the PATH because codspeed's installer script somehow doesn't
      - name: Add $HOME/.cargo/bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5
        with:
          mode: simulation
          run: CACHE_URI=redis://redis DATABASE_URI=postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST/$POSTGRES_DB uv run pytest test/integration_tests --codspeed -m "not benchmark_walltime"
          token: ${{ secrets.CODSPEED_TOKEN }}
        env:
          POSTGRES_DB: orchestrator-core-test
          POSTGRES_USER: nwa
          POSTGRES_PASSWORD: nwa
          POSTGRES_HOST: postgres
          ENVIRONMENT: TESTING

  codspeed-walltime:
    # Simulation counts only the pytest process's instructions, so it misses time spent in Postgres.
    # A shared runner is noisier than the macro runner CodSpeed advises for walltime, but needs no setup.
    name: Run benchmarks (walltime)
    runs-on: ubuntu-26.04
    # No job container: walltime profiles on the host, so services publish their ports there.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: nwa
          POSTGRES_USER: nwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.23"
          # Walltime profiling needs Python 3.12+; keep it equal to the simulation job's image.
          python-version: "3.13"

      - name: Install the project
        run: uv sync --all-extras --dev

      - uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5
        with:
          mode: walltime
          # Shared runners are noisy and these benchmarks take up to ~800ms, so CodSpeed's defaults
          # (~2-3 rounds before the 1s cap) give too few samples. Warm up, then measure for longer.
          run: CACHE_URI=redis://localhost DATABASE_URI=postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST/$POSTGRES_DB uv run pytest test/integration_tests --codspeed --codspeed-warmup-time 2 --codspeed-max-time 10 -m benchmark_walltime
          token: ${{ secrets.CODSPEED_TOKEN }}
        env:
          POSTGRES_DB: orchestrator-core-test
          POSTGRES_USER: nwa
          POSTGRES_PASSWORD: nwa
          POSTGRES_HOST: localhost
          ENVIRONMENT: TESTING
