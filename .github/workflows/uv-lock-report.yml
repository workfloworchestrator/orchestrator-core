name: Generate uv.lock report

on:
  pull_request:
    paths:
      - 'uv.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: mw-root/uv-lock-report@459802bf235b5ff0ece0c7f8c243084136a6d689 # v0.15.5
        with:
          output-format: "table"
          github-token: ${{ secrets.GITHUB_TOKEN }}
