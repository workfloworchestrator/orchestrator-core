[tox]
# Keep in line with `requires-python` in pyproject.toml and the matrix in
# .github/workflows/run-unit-tests.yml.
env_list = py311, py312, py313, py314
requires = tox-uv

[testenv]
# One locked uv environment per Python version in .tox/<env>, reusing uv.lock
# and the local uv cache. Re-run after dependency changes to refresh them.
runner = uv-venv-lock-runner
uv_sync_flags = --all-groups, --all-extras
# tox does not inherit the parent environment. The unit suite only needs
# ENVIRONMENT=TESTING; DATABASE_URI / CACHE_URI are deliberately not passed so
# the tests never touch a real Postgres or Redis.
set_env = ENVIRONMENT = TESTING
commands = pytest {posargs:test/unit_tests}
