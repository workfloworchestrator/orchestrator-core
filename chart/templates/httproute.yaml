{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orchestrator-core.fullname" . }}
  labels:
    {{- include "orchestrator-core.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The API is served under /api (and the MCP server under /mcp); a UI attaches its own route for /
  # on the same listener.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        {{- if .Values.mcp.enabled }}
        - path:
            type: PathPrefix
            value: /mcp
        {{- end }}
      backendRefs:
        - name: {{ include "orchestrator-core.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
