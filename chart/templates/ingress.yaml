{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orchestrator-core.fullname" . }}
  labels:
    {{- include "orchestrator-core.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          # The API is served under /api (and the MCP server under /mcp); a UI takes / on the same host.
          {{- range $path := ternary (list "/api" "/mcp") (list "/api") $.Values.mcp.enabled }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "orchestrator-core.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
