{{- if .Values.secretProviderClass.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "orchestrator-core.fullname" . }}
  labels:
    {{- include "orchestrator-core.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretProviderClass.provider }}
  # Synced into a Secret that every orchestrator container reads through envFrom.
  secretObjects:
    - secretName: {{ include "orchestrator-core.fullname" . }}-secret-provider
      type: Opaque
      data:
        {{- range .Values.secretProviderClass.objects }}
        - key: {{ .key }}
          objectName: {{ .objectName }}
        {{- end }}
  parameters:
    keyvaultName: {{ .Values.secretProviderClass.keyVaultName | quote }}
    tenantId: {{ .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretProviderClass.objects }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}
{{- end }}
