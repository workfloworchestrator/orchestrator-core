apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orchestrator-core.fullname" . }}-env
  labels:
    {{- include "orchestrator-core.labels" . | nindent 4 }}
data:
  {{- range $key, $value := include "orchestrator-core.envConfig" . | fromYaml }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- if .Values.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator-core.fullname" . }}-env
  labels:
    {{- include "orchestrator-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
